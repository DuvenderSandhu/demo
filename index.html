<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI4Bharat Hindi Transliteration Box</title>
<script src="https://cdn.jsdelivr.net/npm/@ai4bharat/indic-transliterate@1.3.8/dist/index.min.js"></script>
<style>
  body {
    font-family: Arial, sans-serif;
    padding: 40px;
    font-size: 20px;
  }
  .input-box {
    font-size: 22px;
    width: 500px;
    padding: 8px;
  }
</style>
</head>
<body>

<h2>Transliteration with Suggestion Box (like Google Input)</h2>

<!-- Input box where AI4Bharat adds suggestion dropdown -->
<input id="input" class="input-box" placeholder="Type Roman Hindi..." />

<script>
  // Initialize the transliteration box
  IndicTransliterate.init({
    lang: "hi",
    inputElement: document.getElementById("input"),
    showSuggestions: true, // enables the popup box
    showCurrentWord: true  // shows transliteration as you type
  });
</script>

</body>
</html>
