<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Google-style Hindi Transliteration</title>
<script src="https://cdn.jsdelivr.net/npm/sanscript@0.0.2/index.min.js"></script>
<style>
  body {
    font-size: 22px;
    padding: 40px;
    font-family: Arial, sans-serif;
  }
  textarea {
    width: 100%;
    max-width: 700px;
    height: 140px;
    font-size: 22px;
    padding: 10px;
  }
  #output {
    font-size: 26px;
    margin-top: 20px;
    border: 1px solid #ccc;
    padding: 15px;
    min-height: 80px;
    background-color: #fafafa;
    line-height: 1.5;
  }
</style>
</head>
<body>

<h2>Google-Style Hindi Input (Offline)</h2>

<textarea id="input" placeholder="Type Roman Hindi..."></textarea>
<div id="output"></div>

<script>
const input = document.getElementById("input");
const output = document.getElementById("output");

let lastWord = "";
let hindiText = "";

input.addEventListener("input", () => {
  const value = input.value;
  const words = value.split(/\s+/); // split on space

  // last typed word (Roman)
  const currentWord = words[words.length - 1];

  // transliterate only the current word
  const transliterated = Sanscript.t(currentWord, "itrans", "devanagari");

  // combine: all previous words + transliterated last word
  const combined = [...words.slice(0, -1), transliterated].join(" ");
  output.textContent = combined;
});
</script>

</body>
</html>
