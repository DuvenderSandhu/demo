<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hindi Transliteration - Sanscript</title>
<script src="https://cdn.jsdelivr.net/npm/sanscript@0.0.2/index.min.js"></script>
<style>
  body {
    font-size: 22px;
    padding: 40px;
    font-family: Arial, sans-serif;
  }
  input, textarea {
    font-size: 22px;
    width: 100%;
    max-width: 600px;
    padding: 8px;
  }
  #output {
    font-size: 26px;
    margin-top: 20px;
    color: #222;
    border: 1px solid #ccc;
    padding: 10px;
    min-height: 50px;
  }
</style>
</head>
<body>

<h2>Type Roman Hindi → Get Devanagari (Auto Transliteration)</h2>

<textarea id="input" rows="4" placeholder="Type Roman Hindi..."></textarea>
<div id="output"></div>

<script>
  const input = document.getElementById("input");
  const output = document.getElementById("output");

  // Run transliteration every time input changes
  input.addEventListener("input", () => {
    const roman = input.value.trim();
    const devanagari = Sanscript.t(roman, "itrans", "devanagari");
    output.textContent = devanagari;
  });

  // Optional: also update on blur/change if you prefer onchange specifically
  input.addEventListener("change", () => {
    const roman = input.value.trim();
    const devanagari = Sanscript.t(roman, "itrans", "devanagari");
    output.textContent = devanagari;
  });
</script>

</body>
</html>
